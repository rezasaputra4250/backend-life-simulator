name: Perlindungan Branch

on:
  pull_request:
    branches:
      - local
      - develop
      - staging
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perlindungan-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validasi-pull-request:
    name: Validasi aturan Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Tolak PR yang masih draft
        if: github.event.pull_request.draft == true
        run: |
          echo "Pull Request masih berstatus draft."
          echo "Ubah ke 'Ready for review' sebelum meminta merge."
          exit 1

      - name: Validasi alur branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch sumber: ${HEAD_BRANCH}"
          echo "Branch tujuan: ${BASE_BRANCH}"

          if [ "${BASE_BRANCH}" = "local" ]; then
            case "${HEAD_BRANCH}" in
              feature/*|bugfix/*|hotfix/*|fix/*|chore/*|release/*)
                echo "PR ke local berasal dari branch kerja yang valid."
                ;;
              *)
                echo "PR ke local hanya boleh dari branch feature/*, bugfix/*, hotfix/*, fix/*, chore/*, atau release/*."
                exit 1
                ;;
            esac
          fi

          if [ "${BASE_BRANCH}" = "develop" ] && [ "${HEAD_BRANCH}" != "local" ]; then
            echo "PR ke develop hanya boleh dari branch local."
            exit 1
          fi

          if [ "${BASE_BRANCH}" = "staging" ] && [ "${HEAD_BRANCH}" != "develop" ]; then
            echo "PR ke staging hanya boleh dari branch develop."
            exit 1
          fi

          if { [ "${BASE_BRANCH}" = "main" ] || [ "${BASE_BRANCH}" = "master" ]; } && [ "${HEAD_BRANCH}" != "staging" ]; then
            echo "PR ke main/master hanya boleh dari branch staging."
            exit 1
          fi

          echo "Alur branch valid."

  validasi-file-sensitif:
    name: Validasi file sensitif
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == 'local' || github.ref_name == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pastikan file env rahasia tidak ikut commit
        run: |
          set -e

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            CHANGED_FILES="$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD)"
          else
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          fi

          echo "${CHANGED_FILES}" | grep -E '(^|/)\.env($|\.production$|\.stagging$|\.staging$)' && {
            echo "File .env, .env.production, .env.stagging, atau .env.staging tidak boleh di-commit."
            echo "Gunakan .env.example untuk daftar nama variabel tanpa nilai secret."
            exit 1
          }

          echo "Tidak ada file env rahasia yang berubah."

      - name: Cek pola secret yang umum
        run: |
          set -e
          POLA_SECRET='API-Key|APP-ID|Authorization: Bearer|CLIENT_SECRET|SECRET_KEY|PASSWORD=|TOKEN=|PRIVATE KEY'

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            CHANGED_FILES="$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD)"
          else
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          fi

          FILES_TO_SCAN="$(echo "${CHANGED_FILES}" | grep -E '^(src|app|components|hooks|utils|config|database|routes|scripts)/.*\.(ts|tsx|js|jsx|json|env|yml|yaml)$' || true)"

          if [ -z "${FILES_TO_SCAN}" ]; then
            echo "Tidak ada file aplikasi yang perlu dicek untuk pola secret."
            exit 0
          fi

          FOUND_SECRET=0
          for file in ${FILES_TO_SCAN}; do
            if [ -f "${file}" ] && grep -nE "${POLA_SECRET}" "${file}"; then
              FOUND_SECRET=1
            fi
          done

          if [ "${FOUND_SECRET}" -eq 1 ]; then
            echo "Ditemukan pola yang mirip secret atau credential pada file yang berubah."
            echo "Periksa hasil di atas. Jika itu contoh aman, pindahkan ke .env.example tanpa nilai asli."
            exit 1
          fi

          echo "Tidak ditemukan pola secret umum pada area yang diperiksa."

  pemeriksaan-node:
    name: Pemeriksaan Node.js backend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == 'local' || github.ref_name == 'develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependency Node.js
        run: npm ci

      - name: Jalankan test Node.js
        run: npm test

  audit-dependency:
    name: Audit dependency
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == 'local' || github.ref_name == 'develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependency Node.js
        run: npm ci

      - name: Audit dependency npm
        run: npm audit --audit-level=high

  semgrep:
    name: Scan keamanan Semgrep
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == 'local' || github.ref_name == 'develop'
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Jalankan Semgrep
        run: semgrep scan --config auto
