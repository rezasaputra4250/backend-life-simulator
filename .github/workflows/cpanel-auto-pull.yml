name: Deploy Backend ke cPanel

on:
  push:
    branches:
      - develop
      - staging
  workflow_dispatch:
    inputs:
      ref:
        description: Branch yang akan dideploy secara manual.
        required: true
        type: choice
        options:
          - develop
          - staging
          - main
          - master
        default: staging
      target:
        description: Environment deploy.
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-backend-cpanel-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'staging' && 'staging' || 'development') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull dan restart backend cPanel
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'staging' && 'staging' || 'development') }}
    steps:
      - name: Validasi branch dan target deploy
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'staging' && 'staging' || 'development') }}
        run: |
          set -euo pipefail

          case "${DEPLOY_REF}:${DEPLOY_TARGET}" in
            develop:development|staging:staging|main:production|master:production)
              echo "Branch ${DEPLOY_REF} akan dideploy ke ${DEPLOY_TARGET}."
              ;;
            *)
              echo "Kombinasi branch dan target deploy tidak valid: ${DEPLOY_REF} -> ${DEPLOY_TARGET}."
              exit 1
              ;;
          esac

      - name: Validasi secret deploy
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_BACKEND_PATH: ${{ secrets.CPANEL_BACKEND_PATH }}
        run: |
          set -euo pipefail

          for variable in CPANEL_SSH_HOST CPANEL_SSH_USER CPANEL_SSH_PRIVATE_KEY CPANEL_SSH_KNOWN_HOSTS CPANEL_BACKEND_PATH; do
            if [ -z "${!variable}" ]; then
              echo "Secret ${variable} wajib diisi."
              exit 1
            fi
          done

      - name: Siapkan SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/cpanel-ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$ssh_dir/deploy_key"
          chmod 600 "$ssh_dir/deploy_key"
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"

      - name: Pull dan restart backend di cPanel
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_BACKEND_PATH: ${{ secrets.CPANEL_BACKEND_PATH }}
          CPANEL_NPM_BIN: ${{ secrets.CPANEL_NPM_BIN }}
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/cpanel-ssh"
          ssh_args=(-i "$ssh_dir/deploy_key" -p "${CPANEL_SSH_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts")

          ssh "${ssh_args[@]}" "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" bash -s -- \
            "$CPANEL_BACKEND_PATH" "$DEPLOY_BRANCH" "${CPANEL_NPM_BIN:-npm}" <<'REMOTE_SCRIPT'
          set -euo pipefail

          deploy_path="$1"
          deploy_branch="$2"
          npm_bin="$3"

          cd "$deploy_path"
          git fetch origin "$deploy_branch"
          git checkout "$deploy_branch"
          git reset --hard "origin/$deploy_branch"
          "$npm_bin" ci --omit=dev
          "$npm_bin" run migrate

          mkdir -p tmp
          touch tmp/restart.txt
          echo "Deploy backend cPanel selesai pada commit $(git rev-parse --short HEAD)."
          REMOTE_SCRIPT
