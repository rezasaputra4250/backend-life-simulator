version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Jakarta
    target-branch: local
    open-pull-requests-limit: 5
    labels:
      - dependency
      - security
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Asia/Jakarta
    target-branch: local
    open-pull-requests-limit: 5
    labels:
      - dependency
      - security
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    target-branch: local
    open-pull-requests-limit: 5
    labels:
      - dependency
      - ci
    commit-message:
      prefix: chore
      include: scope
